<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Analyst Master</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      padding: 2rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    header p {
      color: #b0b0b0;
      font-size: 14px;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .upload-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .upload-zone {
      border: 2px dashed #7c3aed;
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      cursor: pointer;
      background: rgba(124, 58, 237, 0.05);
      transition: all 0.3s;
      margin-bottom: 1.5rem;
    }

    .upload-zone:hover {
      background: rgba(124, 58, 237, 0.15);
      border-color: #8b5cf6;
    }

    .upload-zone input {
      display: none;
    }

    .upload-zone .icon {
      font-size: 48px;
      margin-bottom: 1rem;
    }

    .upload-zone h3 {
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .upload-zone p {
      color: #b0b0b0;
      font-size: 13px;
    }

    #fileName {
      color: #7c3aed;
      margin-top: 0.75rem;
      font-size: 12px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b0b0b0;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(124, 58, 237, 0.5);
    }

    input::placeholder {
      color: #6b7280;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .analysis-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(10px);
    }

    .analysis-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
      display: none;
    }

    .analysis-card.show {
      display: block;
    }

    .vip-badge {
      display: inline-block;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .pair-info {
      margin-bottom: 1.5rem;
    }

    .pair-info h3 {
      color: #b0b0b0;
      font-size: 12px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .pair-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .trend-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .trend-bullish {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .trend-bearish {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .trend-neutral {
      background: rgba(107, 114, 128, 0.2);
      color: #d1d5db;
    }

    .entry-box {
      background: rgba(59, 130, 246, 0.15);
      border-left: 3px solid #3b82f6;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .entry-label {
      color: #93c5fd;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .entry-value {
      color: #3b82f6;
      font-size: 20px;
      font-weight: 700;
    }

    .levels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .level-item {
      padding: 1rem;
      border-radius: 8px;
      border-left: 3px solid;
    }

    .level-item.sl {
      background: rgba(239, 68, 68, 0.1);
      border-left-color: #ef4444;
    }

    .level-item.tp {
      background: rgba(34, 197, 94, 0.1);
      border-left-color: #22c55e;
    }

    .level-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #93c5fd;
    }

    .level-item.sl .level-label {
      color: #fca5a5;
    }

    .level-item.tp .level-label {
      color: #86efac;
    }

    .level-value {
      font-size: 18px;
      font-weight: 700;
    }

    .rr-box {
      background: rgba(168, 85, 247, 0.1);
      border-left: 3px solid #a855f7;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .confidence-bar {
      margin-bottom: 1rem;
    }

    .confidence-label {
      font-size: 12px;
      color: #b0b0b0;
      margin-bottom: 0.5rem;
    }

    .confidence-fill {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .confidence-value {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #6d28d9);
      width: 0%;
      transition: width 0.3s;
    }

    .analysis-text {
      color: #d1d5db;
      font-size: 13px;
      line-height: 1.6;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .loading {
      text-align: center;
      padding: 2rem;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(124, 58, 237, 0.3);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    @media (max-width: 1024px) {
      .main {
        grid-template-columns: 1fr;
      }

      .levels-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 CHART ANALYST MASTER</h1>
      <p>Cloud-based AI Trading Chart Analysis</p>
    </header>

    <div class="main">
      <!-- Upload Section -->
      <div class="upload-section">
        <h2 style="margin-bottom: 1.5rem; font-size: 18px;">Upload Chart</h2>

        <div class="upload-zone" onclick="document.getElementById('chartFile').click()">
          <div class="icon">📈</div>
          <h3>Click to upload</h3>
          <p>or drag & drop chart image</p>
          <div id="fileName"></div>
          <input type="file" id="chartFile" accept="image/*">
        </div>

        <div class="form-group">
          <label>Pair (Optional)</label>
          <input type="text" id="pair" placeholder="e.g., XAUUSD, EURUSD, BTC">
        </div>

        <div class="form-group">
          <label>Timeframe (Optional)</label>
          <select id="timeframe">
            <option value="">Auto-detect</option>
            <option value="1m">1 Minute</option>
            <option value="5m">5 Minutes</option>
            <option value="15m">15 Minutes</option>
            <option value="1h">1 Hour</option>
            <option value="4h">4 Hours</option>
            <option value="1d">1 Day</option>
          </select>
        </div>

        <button id="analyzeBtn" onclick="analyzeChart()">Analyze Chart</button>

        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
      </div>

      <!-- Results Section -->
      <div class="analysis-section">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p style="margin-top: 1rem;">Analyzing your chart...</p>
        </div>

        <div id="results">
          <div class="analysis-card" id="analysisCard">
            <div class="vip-badge">⭐ VIP SIGNAL</div>

            <div class="pair-info">
              <h3>Pair</h3>
              <div class="pair-name" id="resultPair">—</div>
              <span class="trend-badge" id="resultTrend">—</span>
            </div>

            <div class="entry-box">
              <div class="entry-label">Entry Range</div>
              <div class="entry-value" id="resultEntry">—</div>
            </div>

            <div class="levels-grid">
              <div class="level-item sl">
                <div class="level-label">Stop Loss</div>
                <div class="level-value" id="resultSL">—</div>
              </div>
              <div class="level-item tp">
                <div class="level-label">TP 1</div>
                <div class="level-value" id="resultTP1">—</div>
              </div>
              <div class="level-item tp">
                <div class="level-label">TP 2</div>
                <div class="level-value" id="resultTP2">—</div>
              </div>
              <div class="level-item tp">
                <div class="level-label">TP 3</div>
                <div class="level-value" id="resultTP3">—</div>
              </div>
            </div>

            <div class="rr-box">
              <div class="level-label">Risk : Reward</div>
              <div class="level-value" id="resultRR">—</div>
            </div>

            <div class="confidence-bar">
              <div class="confidence-label">Confidence Level</div>
              <div class="confidence-fill">
                <div class="confidence-value" id="confidenceBar"></div>
              </div>
              <div style="font-size: 12px; color: #b0b0b0; margin-top: 0.5rem;">
                <span id="confidenceText">—</span>%
              </div>
            </div>

            <div class="analysis-text">
              <strong>📈 Analysis:</strong><br>
              <span id="resultAnalysis">—</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedFile = null;

    // File upload handling
    document.getElementById('chartFile').addEventListener('change', function(e) {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        document.getElementById('fileName').textContent = '✅ ' + selectedFile.name;
      }
    });

    // Drag and drop
    const uploadZone = document.querySelector('.upload-zone');
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.style.background = 'rgba(124, 58, 237, 0.15)';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.background = 'rgba(124, 58, 237, 0.05)';
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.style.background = 'rgba(124, 58, 237, 0.05)';
      if (e.dataTransfer.files[0]) {
        selectedFile = e.dataTransfer.files[0];
        document.getElementById('chartFile').files = e.dataTransfer.files;
        document.getElementById('fileName').textContent = '✅ ' + selectedFile.name;
      }
    });

    async function analyzeChart() {
      if (!selectedFile) {
        showError('Please select a chart image');
        return;
      }

      // Read file as base64
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];

        document.getElementById('loading').style.display = 'block';
        document.getElementById('analysisCard').classList.remove('show');
        document.getElementById('error').style.display = 'none';

        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              imageBase64: base64,
              pair: document.getElementById('pair').value,
              timeframe: document.getElementById('timeframe').value,
            })
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Analysis failed');
          }

          const data = await response.json();
          displayResults(data);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('analysisCard').classList.add('show');
          showSuccess('Chart analyzed successfully!');

        } catch (error) {
          document.getElementById('loading').style.display = 'none';
          showError(error.message);
        }
      };
      reader.readAsDataURL(selectedFile);
    }

    function displayResults(data) {
      document.getElementById('resultPair').textContent = data.pair;
      
      const trendElement = document.getElementById('resultTrend');
      trendElement.textContent = data.trend;
      trendElement.className = `trend-badge trend-${data.trend.toLowerCase()}`;
      
      document.getElementById('resultEntry').textContent = data.entry_range;
      document.getElementById('resultSL').textContent = data.stop_loss;
      document.getElementById('resultTP1').textContent = data.tp1;
      document.getElementById('resultTP2').textContent = data.tp2;
      document.getElementById('resultTP3').textContent = data.tp3;
      document.getElementById('resultRR').textContent = data.risk_reward;
      document.getElementById('resultAnalysis').textContent = data.analysis;
      
      const confidence = parseInt(data.confidence);
      document.getElementById('confidenceBar').style.width = confidence + '%';
      document.getElementById('confidenceText').textContent = confidence;
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '❌ ' + message;
      errorDiv.style.display = 'block';
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('success');
      successDiv.textContent = '✅ ' + message;
      successDiv.style.display = 'block';
      setTimeout(() => {
        successDiv.style.display = 'none';
      }, 3000);
    }
  </script>
</body>
</html>
